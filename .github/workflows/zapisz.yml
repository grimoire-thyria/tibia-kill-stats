name: Zapisz statystyki zabic

on:
  schedule:
    # UTC. Statystyki przeliczaja sie w nocy czasu polskiego; druga proba
    # dopisuje swiaty, ktore za pierwszym razem byly jeszcze nieswieze.
    - cron: '20 4 * * *'
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zapis-repo

jobs:
  zapisz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node zapisz.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data historia
          git diff --cached --quiet || git commit -m "statystyki $(date -u +%F)"
          git pull --rebase -q || true
          git push
