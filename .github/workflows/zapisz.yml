name: Zapisz statystyki zabic

on:
  schedule:
    # UTC. Co godzine od 2:20 do 9:20 UTC (zima 3:20-10:20, lato 4:20-11:20
    # czasu polskiego). Swiaty, ktore juz maja dzisiejszy plik, sa pomijane,
    # a nieswieze (te same liczby co wczoraj) nie sa zapisywane, wiec kazda
    # kolejna proba dopisuje tylko to, co tibia.com zdazyl przeliczyc.
    # (2.99.148, autor: ubicia przychodzily dopiero ok. 11.)
    - cron: '20 2-9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zapis-repo

jobs:
  zapisz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node zapisz.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data historia
          git diff --cached --quiet || git commit -m "statystyki $(date -u +%F)"
          git pull --rebase -q || true
          git push
